[package]
name = "mojibake-lab"
version = "0.1.0"
edition = "2021"
description = "An offline encoding forensics workbench"
license = "MIT"

[lib]
name = "mojibake_lab"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mojibake-core = { path = "../crates/mojibake-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
