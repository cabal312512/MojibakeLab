name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --locked
      - run: npm run desktop:build
      - name: Collect third-party licenses
        run: node scripts/collect-licenses.mjs
      - name: Package Windows portable download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = 'artifacts/MojibakeLab'
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Copy-Item -LiteralPath 'target/release/mojibake-lab.exe' -Destination "$packageRoot/MojibakeLab.exe"
          Copy-Item -LiteralPath 'README.md', 'README.en.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.txt' -Destination $packageRoot
          Copy-Item -LiteralPath 'docs' -Destination "$packageRoot/docs" -Recurse
          Copy-Item -LiteralPath 'docs/PORTABLE.txt' -Destination "$packageRoot/使用说明.txt"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath "artifacts/mojibake-lab-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - name: Package macOS or Linux download
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_root='artifacts/MojibakeLab'
          mkdir -p "$package_root"
          cp target/release/mojibake-lab "$package_root/"
          cp README.md README.en.md LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt "$package_root/"
          cp -R docs "$package_root/docs"
          tar -czf "artifacts/mojibake-lab-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C artifacts MojibakeLab
      - uses: actions/upload-artifact@v4
        with:
          name: mojibake-lab-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error
