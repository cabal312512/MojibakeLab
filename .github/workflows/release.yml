name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/release-plan.json']
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --bundles nsis
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-22.04
            platform: linux
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Check release version
        shell: bash
        run: |
          node -e "const fs=require('fs');const v=require('./package.json').version; if(require('./.github/release-plan.json').version!==v || require('./src-tauri/tauri.conf.json').version!==v)throw Error('Version mismatch'); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+v)throw Error('Tag mismatch');"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - name: Build release bundles
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Package downloads
        run: node scripts/package-release.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          for suffix in windows-x64-portable.exe windows-x64-portable.zip windows-x64-setup.exe macos-universal.dmg macos-universal.app.zip linux-x64.AppImage linux-x64.deb linux-x64.tar.gz; do
            test -s "artifacts/MojibakeLab-$version-$suffix"
          done
          git archive --format=zip --prefix=MojibakeLab/ --output="artifacts/MojibakeLab-$version-source.zip" HEAD
          (cd artifacts && sha256sum -- * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            node -e "const r=require('./release-state.json');if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA)throw Error('Refusing to replace an existing release');"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Mojibake Lab $tag" --notes-file "$notes" --draft
          fi
          gh release upload "$tag" artifacts/* --clobber
          gh release edit "$tag" --draft=false --latest
